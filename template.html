<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <nav aria-label="Primary navigation">
      <span class="nav-mono"></span>
      <ul class="nav-links"></ul>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-grid-bg"></div>
      <div class="hero-inner">
        <p class="hero-tag"></p>
        <h1 id="hero-title"></h1>
        <p class="hero-desc"></p>
        <div class="hero-stats"></div>
      </div>
    </section>

    <section id="how" aria-labelledby="how-title">
      <p class="sec-label"></p>
      <h2 id="how-title" class="sec-title"></h2>
      <div class="how-grid"></div>
    </section>

    <section id="work" aria-labelledby="work-title">
      <p class="sec-label"></p>
      <h2 id="work-title" class="sec-title"></h2>
      <div class="work-terminal">
        <div class="terminal-bar">
          <div class="dot dot-r"></div>
          <div class="dot dot-y"></div>
          <div class="dot dot-g"></div>
        </div>
        <div class="terminal-body"></div>
      </div>
    </section>

    <section id="principles" aria-labelledby="principles-title">
      <p class="sec-label"></p>
      <h2 id="principles-title" class="sec-title"></h2>
      <div class="principles-list"></div>
    </section>

    <section id="thinking" aria-labelledby="thinking-title">
      <p class="sec-label"></p>
      <h2 id="thinking-title" class="sec-title"></h2>
      <div class="writing-grid"></div>
    </section>

    <section id="contact" aria-labelledby="contact-title">
      <p class="sec-label"></p>
      <h2 id="contact-title" class="sec-title"></h2>
      <div class="contact-split">
        <div class="contact-left">
          <div class="contact-intro"></div>
          <div class="stack"></div>
        </div>
        <div class="contact-right"></div>
      </div>
    </section>
  </main>

  <footer>
    <p></p>
    <span class="footer-status"><span class="status-dot"></span></span>
  </footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
